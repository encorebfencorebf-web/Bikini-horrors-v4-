name: Android Release

on:
  workflow_dispatch:

jobs:
  Android:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: zulu
          java-version: '18'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1.2.0
        with:
          haxe-version: 4.3.4

      - name: Locate Compiler Source
        run: |
          echo "=== Haxe version ==="
          haxe -version

          echo "=== Haxelib config ==="
          haxelib config

          echo "=== Searching Compiler.hx ==="
          find "$HOME" /usr/share/haxe /opt/hostedtoolcache \
            -type f -name "Compiler.hx" 2>/dev/null || true

      - name: Installing Libraries
        run: |
          haxelib setup ~/haxelib

          haxe -cp commandline -D analyzer-optimize --run Main setup -s

          haxelib run lime rebuild hxcpp
          haxelib install hxcpp-debug-server

          haxelib list

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Building
        run: |
          haxelib run lime build android -final

      - name: Locate APK
        if: always()
        run: |
          echo "=== APK files ==="
          find export -type f -name "*.apk" 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  Publish:
    needs: Android
    runs-on: ubuntu-latest

    permissions: write-all

    steps:
      - name: Download
        uses: actions/download-artifact@main
        with:
          name: androidBuild
          path: ${{ github.workspace }}

      - name: Show Downloaded Files
        run: |
          find . -type f -name "*.apk"

      - name: Publish
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          automatic_release_tag: v1.0.2-pre-release
          title: Codename Engine Android
          files: |
            ${{ github.workspace }}/**/*.apk
